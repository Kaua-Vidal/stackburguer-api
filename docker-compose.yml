services:
  postgres-db:
    image: postgres:latest
    container_name: stackburguer-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stackburguer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  mongodb:
    image: mongo:latest
    container_name: stackburguer
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: stackburguer-logs